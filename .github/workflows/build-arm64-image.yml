name: build-nanobot-arm64

# 手动触发 + 推送到 main 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "webui/**"
      - "nanobot/**"
      - ".github/workflows/build-arm64-image.yml"

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 用内置 GITHUB_TOKEN 推送 GHCR，无需额外配密钥
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NANOBOT_CHANNELS=whatsapp
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanobot:arm64
            ghcr.io/${{ github.repository_owner }}/nanobot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
